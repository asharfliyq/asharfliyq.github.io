name: Update Status GIF

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download latest status.gif
        run: |
          curl -L -o status.gif http://36.ein.itsby.design:9090/status.gif

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add status.gif
          git diff --cached --quiet || git commit -m "Auto update status.gif"
          git push
